site_name: 数字图像处理 (YatDIP)
site_description: 中山大学《数字图像处理》课程教学与实验平台
site_author: 傅祉珏
site_url: https://YatDIP.github.io/

theme:
  name: material
  language: zh
  features:
    - navigation.tabs
    - navigation.top
    - content.code.copy
  palette:
    scheme: default
    primary: custom
    accent: custom

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.arithmatex:
      generic: true
  - admonition
  - pymdownx.details

nav:
  - 🏠 首页: index.md
  - 📖 教学文档:
    - 第一部分：数字图像基础: lectures/part1.md
    - 第二部分：图像增强与滤波: lectures/part2.md
    - 第三部分：图像处理综合应用: lectures/part3.md
  - 🚀 项目大厅: projects.md
  - 💻 前往代码仓库: https://github.com/YatDIP/YatDIP-Labs

extra_css:
  - stylesheets/custom.css

extra_javascript:
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
