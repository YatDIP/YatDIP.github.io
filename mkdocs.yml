site_name: YatDIP - 数字图像处理
site_description: 探索像素背后的数学奥秘
site_author: Your Name

theme:
  name: material
  language: zh
  features:
    - navigation.tabs # 开启顶部导航栏
    - navigation.top  # 开启回到顶部按钮
    - content.code.copy # 代码一键复制
  palette:
    scheme: default
    primary: indigo
    accent: blue

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.arithmatex:
      generic: true # 支持数学公式
  - admonition
  - pymdownx.details

nav:
  - 🏠 首页: index.md
  - 📖 教学文档:
    - 第一部分：数字图像基础: lectures/part1.md
    - 第二部分：图像增强与滤波: lectures/part2.md
    - 第三部分：图像处理综合应用: lectures/part3.md
  - 🚀 项目大厅: projects.md
  - 💻 前往代码仓库: https://github.com/your-username/YatDIP-Labs